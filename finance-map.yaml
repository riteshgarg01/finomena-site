# Finance back-office map — generic version shown on finomenahq.com (#finance-map).
# Edit this file and push: the page re-renders from it. Field guide:
#   activities   – sub-processes in this area
#   agent_ideas  – where agentic AI can act
#   priority     – where agentic AI pays off first: high / medium / low / skip (served by existing tools)
#   finomena     – live (product running) / next / idea (agentic opportunity)
#   product_name, product_link, finomena_note – shown on the card and in its detail panel
#   reports      – "adjacent": drawn with a dashed line (works alongside finance)
#   flows        – connectors between areas (from → to)

meta:
  title: "Agentic AI across the finance function"
  org_context: "A typical Indian mid-to-large enterprise"
  pilot_focus: controllership
  focus_label: "Where to start"

root:
  id: cfo
  name: CFO Office

domains:

  - id: controllership
    name: Controllership
    priority: high
    children:
      - id: accounting_close
        name: Accounting + Month Close
        activities: [journal entries, reconciliations, accruals, close checklist]
        outputs: [P&L, Balance Sheet, Cash Flow]
        agent_ideas:
          - Reconcile vendor, bank and sub-ledgers to the GL, with exceptions triaged and explained
          - Orchestrate the close checklist and draft variance commentary
        priority: high
        finomena: live
        product_name: "Auto Recon (vendor reconciliation)"
        product_link: "#auto-recon"
        finomena_note: "Vendor-ledger reconciliation is live; bank and sub-ledger reconciliation and close orchestration are next"
      - id: audit
        name: Audit (Internal + Statutory)
        activities: [PBC list preparation, evidence collection, auditor queries]
        agent_ideas:
          - Assemble PBC packs and evidence trails from the ERP and documents
          - Draft responses to auditor queries
        priority: high
        finomena: idea
      - id: tax_compliance
        name: Tax & Compliance
        children:
          - id: tax_regular
            name: Regular filings
            activities: [GST returns, TDS, income-tax filings]
            agent_ideas:
              - Prepare returns-ready GST and TDS data from processed invoices
            priority: medium
            finomena: idea
          - id: tax_litigation
            name: Litigation
            activities: [notice tracking, document gathering, reply drafting, hearings]
            agent_ideas:
              - Notice intake, deadline tracking, evidence gathering and draft replies
            priority: high
            finomena: idea
          - id: e_invoicing
            name: E-Invoicing
            notes: "Usually served well by existing GSP and e-invoicing tools"
            priority: skip
      - id: governance
        name: Governance & Compliance
        activities: [data security, access control, disaster management, role management]
        agent_ideas:
          - Periodic access and segregation-of-duties reviews with flagged conflicts
        priority: medium
        finomena: idea
      - id: fixed_assets_inventory
        name: Fixed Assets + Inventory
        activities: [asset register, depreciation, physical verification, inventory valuation]
        priority: low

  - id: shared_services
    name: Finance Ops (Shared Services)
    priority: medium
    children:
      - id: ap
        name: Accounts Payable
        activities: [invoice receipt, PO matching, approvals, posting]
        agent_ideas: [Invoice capture and 2- / 3-way match, vendor query handling]
        priority: high
        finomena: live
        product_name: "Auto Invoice (accounts payable)"
        product_link: "#auto-invoice"
        finomena_note: "Invoice reading, PO matching, GST checks, coding and approvals run today"
      - id: ar
        name: Accounts Receivable
        process_chain: [billing, invoicing, contracting, payment, reconciliation, dispute management, intelligence]
        agent_ideas: [Collections follow-up, cash application, dispute triage]
        priority: medium
        finomena: next
        finomena_note: "Customer reconciliation runs on the same engine as Auto Recon"
      - id: treasury_ops
        name: Treasury Ops
        activities: [cash positioning, bank reconciliation, payments]
        agent_ideas: [Daily cash positioning, bank statement reconciliation]
        priority: medium
        finomena: next

  - id: analyst
    name: Analysis / FP&A
    priority: low
    children:
      - id: business_finance
        name: Business Finance
        activities: [business partnering, data library, unit economics]
      - id: fpa
        name: FP&A
        activities: [forecasting, management reporting, ad-hoc analysis, planning]
        agent_ideas: [MIS pack generation, variance explanation, ad-hoc Q&A on finance data]
        finomena: idea

  - id: procurement
    name: Procurement
    priority: low
    reports: adjacent
    children:
      - { id: vendor_mgmt, name: Vendor Management, activities: [onboarding, verification] }
      - { id: tendering, name: Tendering }
      - { id: pr_po, name: PR + PO }

  - id: crm_ticketing
    name: CRM + Ticketing
    priority: low
    reports: adjacent
    activities: [leads, proposals, quotes, negotiation]

flows:
  - { from: ar, to: accounting_close, label: "receipts & reconciliations" }
  - { from: ap, to: accounting_close, label: "payables & accruals" }
  - { from: treasury_ops, to: accounting_close, label: "bank & cash" }
  - { from: accounting_close, to: audit, label: "financials & evidence" }
  - { from: accounting_close, to: fpa, label: "actuals for MIS" }
  - { from: pr_po, to: ap, label: "PO for 3-way match" }
